[project]
name = "aschenbach-transcriptor"
version = "0.1.0"
description = "Audio and video transcription via local Whisper or Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.1",
    "faster-whisper>=1.2.1",
    "google-genai>=2.30.1",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
aa-transcript = "aa_transcript.main:run"
aschenbach-transcriptor = "aa_transcript.main:run"

[tool.uv]
package = true
